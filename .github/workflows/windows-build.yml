name: Build TermiX for Windows
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install dependencies
        run: npm ci
      - uses: actions/cache/restore@v4
        id: rust-cache
        with:
          path: src-tauri/target
          key: windows-rust-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: windows-rust-${{ hashFiles('src-tauri/Cargo.lock') }}-
      - name: Frontend lifecycle tests
        run: npm test
      - name: Setup and settings browser tests
        run: npx playwright install chromium
      - name: Run setup and settings browser tests
        timeout-minutes: 5
        run: npm run test:ui
      - name: Typecheck and frontend build
        run: npm run build
      - name: Generate application icons from shared SVG
        run: npm run icons
      - name: Rust PTY integration tests
        timeout-minutes: 20
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml -- --test-threads=1
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: src-tauri/target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Build Windows installer
        run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: TermiX-Windows-Installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
