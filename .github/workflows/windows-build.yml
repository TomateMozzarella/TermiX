name: Build TermiX for Windows
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npx playwright install chromium
      - name: Browser workflow tests
        env:
          TERMIX_PREVIEW_DIR: ${{ github.workspace }}/ui-previews
        run: npm run test:ui
      - name: Export mock-IPC visual previews for review
        if: always()
        run: python scripts/export-previews.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TermiX-UI-previews
          path: |
            ui-previews/*.png
            test-results/**
  windows:
    needs: frontend
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: npm ci
      - uses: actions/cache/restore@v4
        id: rust-cache
        with:
          path: src-tauri/target
          key: windows-rust-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: windows-rust-${{ hashFiles('src-tauri/Cargo.lock') }}-
      - name: Fetch locked Rust sources and collect native licenses
        run: |
          cargo fetch --locked --manifest-path src-tauri/Cargo.toml
          python scripts/collect-licenses.py
      - run: npm run build
      - run: npm run icons
      - run: ./scripts/installer-assets.ps1
      - name: Install loopback SSH test dependency
        run: python -m pip install paramiko
      - name: Compile native integration tests
        timeout-minutes: 30
        run: cargo test --no-run --locked --manifest-path src-tauri/Cargo.toml
      - name: Rust PTY, SSH and credential integration tests
        timeout-minutes: 3
        run: ./scripts/test-native.ps1
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: src-tauri/target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Build Windows installer
        run: npm run tauri build
      - name: Verify installed files and refresh of an existing desktop shortcut
        run: ./scripts/test-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: TermiX-Windows-Installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
  desktop-download:
    needs: [frontend, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: TermiX-Windows-Installer
          path: installer
      - name: Export verified installer for the connected desktop
        run: python scripts/export-installer.py
