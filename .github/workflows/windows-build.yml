name: Build TermiX for Windows
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install dependencies
        run: npm ci
      - uses: actions/cache/restore@v4
        id: rust-cache
        with:
          path: src-tauri/target
          key: windows-rust-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: windows-rust-${{ hashFiles('src-tauri/Cargo.lock') }}-
      - name: Frontend lifecycle tests
        run: npm test
      - name: Typecheck and frontend build
        run: npm run build
      - name: Generate temporary application icons
        shell: pwsh
        run: |
          python -m pip install pillow
          New-Item -ItemType Directory -Force src-tauri/icons | Out-Null
          python -c "from PIL import Image,ImageDraw; im=Image.new('RGBA',(256,256),'#1a2535'); d=ImageDraw.Draw(im); d.rounded_rectangle((20,20,236,236),radius=40,fill='#2563eb'); d.text((73,93),'TX',fill='white'); im.save('src-tauri/icons/icon.png'); im.save('src-tauri/icons/icon.ico',sizes=[(16,16),(32,32),(48,48),(256,256)])"
      - name: Rust PTY integration tests
        timeout-minutes: 20
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml -- --test-threads=1
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: src-tauri/target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Build Windows installer
        run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: TermiX-Windows-Installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
