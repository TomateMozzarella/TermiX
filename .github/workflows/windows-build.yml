name: Build TermiX for Windows
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
      - '.gitignore'
  workflow_dispatch:
concurrency:
  group: termix-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  linux-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact collector on Linux
        run: python3 scripts/test-monitor-linux.py
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Release receipt tamper checks
        run: python -m unittest discover -s scripts -p test_release_assets.py
      - run: npx playwright install --with-deps chromium
      - name: Browser workflow tests
        env:
          TERMIX_PREVIEW_DIR: ${{ github.workspace }}/ui-previews
        run: npm run test:ui
      - name: Export mock-IPC visual previews for review
        if: always() && github.event.repository.private
        run: python scripts/export-previews.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TermiX-UI-previews
          retention-days: 7
          path: |
            ui-previews/*.png
            test-results/**
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: npm ci
      - uses: actions/cache/restore@v4
        id: rust-cache
        with:
          path: src-tauri/target
          key: windows-msvc-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            windows-msvc-${{ hashFiles('src-tauri/Cargo.lock') }}-
            windows-release-${{ hashFiles('src-tauri/Cargo.lock') }}-
      - name: Fetch locked Rust sources and collect native licenses
        run: |
          cargo fetch --locked --manifest-path src-tauri/Cargo.toml
          python scripts/collect-licenses.py
      - run: npm run build
      - run: npm run icons
      - run: ./scripts/installer-assets.ps1
      - name: Install loopback SSH test dependency
        run: python -m pip install paramiko
      - name: Compile native integration tests
        timeout-minutes: 30
        run: cargo test --no-run --locked --manifest-path src-tauri/Cargo.toml
      - name: Rust PTY, SSH and credential integration tests
        timeout-minutes: 3
        run: ./scripts/test-native.ps1
      - name: Clear cached installer output before packaging
        run: ./scripts/clean-bundles.ps1
      - name: Prepare checksum-verified Windows bundlers
        run: ./scripts/prepare-bundlers.ps1
      - name: Build Windows installer
        run: ./scripts/build-windows.ps1
      - name: Verify installed files and refresh of an existing desktop shortcut
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: ./scripts/test-installer.ps1
      - name: Package and verify isolated portable application
        run: ./scripts/build-portable.ps1
      - name: Record installer checksums and source commit
        run: python scripts/release-manifest.py
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/main' && steps.rust-cache.outputs.cache-hit != 'true'
        with:
          path: src-tauri/target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: TermiX-Windows-Installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/portable/*.zip
            src-tauri/target/release/bundle/release-manifest.json
            src-tauri/target/release/bundle/SHA256SUMS
          if-no-files-found: error
  desktop-download:
    if: github.event.repository.private
    needs: [frontend, windows, linux-metrics]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: TermiX-Windows-Installer
          path: installer
      - name: Export verified installer for the connected desktop
        run: python scripts/export-installer.py
