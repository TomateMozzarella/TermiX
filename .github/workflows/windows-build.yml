name: Build TermiX for Windows
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resolve-rust-lock:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve dependency lock for the SSH increment
        run: |
          cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
          Write-Output 'TERMIX_LOCK_BEGIN'
          Get-Content -Raw src-tauri/Cargo.lock
          Write-Output 'TERMIX_LOCK_END'
      - uses: actions/upload-artifact@v4
        with:
          name: TermiX-Rust-Lock
          path: src-tauri/Cargo.lock
  windows:
    needs: resolve-rust-lock
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: actions/download-artifact@v4
        with:
          name: TermiX-Rust-Lock
          path: src-tauri
      - name: Install dependencies
        run: npm ci
      - name: Fetch pinned Rust sources and collect native licenses
        run: |
          cargo fetch --locked --manifest-path src-tauri/Cargo.toml
          python scripts/collect-licenses.py
      - uses: actions/cache/restore@v4
        id: rust-cache
        with:
          path: src-tauri/target
          key: windows-rust-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: windows-rust-${{ hashFiles('src-tauri/Cargo.lock') }}-
      - name: Frontend lifecycle tests
        run: npm test
      - name: Setup and settings browser tests
        run: npx playwright install chromium
      - name: Run setup and settings browser tests
        timeout-minutes: 5
        run: npm run test:ui
      - name: Typecheck and frontend build
        run: npm run build
      - name: Generate application icons from shared SVG
        run: npm run icons
      - name: Generate Windows installer artwork
        run: ./scripts/installer-assets.ps1
      - name: Start loopback SSH integration fixture
        shell: pwsh
        run: |
          python -m pip install paramiko
          $fixtureDir = Join-Path $env:RUNNER_TEMP 'termix-ssh-fixture'
          New-Item -ItemType Directory -Force $fixtureDir | Out-Null
          Start-Process python -ArgumentList @('scripts/ssh-test-server.py', '--directory', $fixtureDir, '--port', '22222') -WindowStyle Hidden -RedirectStandardOutput (Join-Path $fixtureDir 'server.out') -RedirectStandardError (Join-Path $fixtureDir 'server.err')
          $deadline = (Get-Date).AddSeconds(30)
          while (!(Test-Path (Join-Path $fixtureDir 'ready'))) { if ((Get-Date) -gt $deadline) { Get-Content (Join-Path $fixtureDir 'server.err'); throw 'SSH fixture did not start' }; Start-Sleep -Milliseconds 100 }
          "TERMIX_SSH_TEST_DIR=$fixtureDir" | Out-File -FilePath $env:GITHUB_ENV -Append
          'TERMIX_SSH_TEST_PORT=22222' | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Prepare isolated native Windows SSH agent fixture
        shell: pwsh
        run: |
          Set-Service ssh-agent -StartupType Manual
          Start-Service ssh-agent
          $key = Join-Path $env:TERMIX_SSH_TEST_DIR 'agent-key.pem'
          icacls $key /inheritance:r /grant:r "${env:USERNAME}:R"
          & "$env:WINDIR/System32/OpenSSH/ssh-add.exe" $key
          if ($LASTEXITCODE -ne 0) { throw 'Could not add isolated test key to SSH agent' }
          'TERMIX_SSH_AGENT_TEST=1' | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Rust PTY integration tests
        timeout-minutes: 20
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml -- --test-threads=1
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: src-tauri/target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Build Windows installer
        run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: TermiX-Windows-Installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
