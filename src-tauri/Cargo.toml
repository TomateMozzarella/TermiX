[package]
name = "termix"
version = "0.11.2"
description = "Cross-platform remote connection manager"
authors = ["TermiX contributors"]
edition = "2021"

[lib]
name = "termix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ssh2 = { version = "=0.9.6", features = ["vendored-openssl", "openssl-on-win32"] }
base64 = "0.22"
sha2 = "0.10"
zeroize = "1"
portable-pty = "=0.9.0"
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "process", "io-util"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_Security", "Win32_Security_Credentials", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_UI_Controls_Dialogs", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Com"] }

