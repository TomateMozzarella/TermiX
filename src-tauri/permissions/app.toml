[[permission]]
identifier = "local-terminal"
description = "Manage allowlisted local PTY shell profiles in the main window."
commands.allow = ["terminal_profiles", "open_terminal", "read_terminal", "write_terminal", "resize_terminal", "close_terminal"]

[[permission]]
identifier = "session-storage"
description = "Read and update non-secret session metadata in the main window."
commands.allow = ["list_sessions", "get_catalog", "reload_catalog", "save_session", "delete_session", "save_folder", "delete_folder", "touch_session", "pick_session_import", "import_sessions", "export_sessions"]

[[permission]]
identifier = "preferences"
description = "Read and save non-secret setup and appearance preferences."
commands.allow = ["get_preferences", "save_preferences", "get_workspace", "save_workspace", "choose_editor", "detect_editor"]

[[permission]]
identifier = "ssh"
description = "Verify SSH host keys, authenticate and open bounded SSH PTY sessions; forget a single optional OS-vault password."
commands.allow = ["ssh_probe", "ssh_cancel", "ssh_open", "ssh_forget_password"]
[[permission]]
identifier = "sftp"
description = "Browse verified SSH transports and transfer files chosen through native dialogs; no arbitrary local paths."
commands.allow = ["sftp_list", "sftp_upload", "sftp_download", "sftp_progress", "sftp_cancel", "sftp_mkdir", "editor_open", "editor_save", "editor_reload", "editor_close", "editor_external", "editor_reload_external"]
